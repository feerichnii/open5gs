name: Lab Model D checks
on:
  push:
    branches: [lab/model-d, main]
  pull_request:
    branches: [lab/model-d, main]

jobs:
  cause-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: E7-05 cause audit (NRF/SCP/AMF/UDM)
        run: sh misc/lab/check-sbi-cause.sh

  build-lab-nfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-setuptools python3-wheel \
            ninja-build build-essential flex bison git libsctp-dev \
            libgnutls28-dev libgcrypt-dev libssl-dev libidn11-dev \
            libmongoc-dev libbson-dev libyaml-dev libnghttp2-dev \
            libmicrohttpd-dev libcurl4-gnutls-dev libtins-dev libtalloc-dev \
            libc-ares-dev meson
      - name: Configure
        run: meson setup build
        env:
          CC: gcc
      - name: Build NRF SCP AMF UDM
        run: |
          ninja -C build open5gs-nrfd open5gs-scpd open5gs-amfd open5gs-udmd
